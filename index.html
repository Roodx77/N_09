<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>لعبة الشخصية</title>

<style>
body{
  margin:0;
  background:#000;
  color:#eee;
  font-family:Arial;
  display:flex;
  justify-content:center;
  align-items:center;
  min-height:100vh;
}

.box{
  width:90%;
  max-width:500px;
  background:#111;
  padding:25px;
  border-radius:20px;
  text-align:center;
}

button{
  width:100%;
  padding:12px;
  margin-top:10px;
  border:none;
  border-radius:10px;
  background:#4fd1c5;
  color:#000;
  cursor:pointer;
}

.result{
  margin-top:20px;
}
</style>
</head>

<body>

<div class="box">
  <h2 id="title">مرحلة 1</h2>
  <div id="question"></div>
  <div id="answers"></div>
  <button onclick="next()">التالي</button>
  <div id="result" class="result"></div>
</div>

<script>
let stage = 0;
let qIndex = 0;

let score = {
  leader:0,
  emotional:0,
  logical:0
};

const stages = [

  // 1 عامة
  [
    {q:"تحب تقضي وقتك؟",a:[
      ["مع الناس","emotional"],
      ["لوحدك","logical"],
      ["تنظم شي","leader"]
    ]},
    {q:"قرار سريع؟",a:[
      ["نعم","leader"],
      ["أفكر","logical"],
      ["حسب شعوري","emotional"]
    ]}
  ],

  // 2 شخصية
  [
    {q:"أنت أقرب؟",a:[
      ["قائد","leader"],
      ["حساس","emotional"],
      ["محلل","logical"]
    ]}
  ],

  // 3 الجنس
  [
    {q:"تفضل؟",a:[
      ["قيادة","leader"],
      ["اهتمام","emotional"],
      ["تفكير","logical"]
    ]}
  ],

  // 4 المزاج
  [
    {q:"مزاجك غالبًا؟",a:[
      ["هادئ","logical"],
      ["متقلب","emotional"],
      ["متحكم","leader"]
    ]}
  ],

  // 5 سياسة
  [
    {q:"قرارات؟",a:[
      ["حازمة","leader"],
      ["مرنة","emotional"],
      ["مدروسة","logical"]
    ]}
  ],

  // 6 دول
  [
    {q:"تحب؟",a:[
      ["نظام","logical"],
      ["حرية","emotional"],
      ["قوة","leader"]
    ]}
  ],

  // 7 نهاية
  []
];

function loadQuestion(){
  document.getElementById("result").innerText = "";

  if(stage >= stages.length-1){
    showResult();
    return;
  }

  let data = stages[stage][qIndex];

  document.getElementById("title").innerText = "مرحلة " + (stage+1);
  document.getElementById("question").innerText = data.q;

  let html = "";
  data.a.forEach(ans=>{
    html += `<button onclick="choose('${ans[1]}')">${ans[0]}</button>`;
  });

  document.getElementById("answers").innerHTML = html;
}

function choose(type){
  score[type]++;
}

function next(){
  qIndex++;

  if(qIndex >= stages[stage].length){
    stage++;
    qIndex = 0;
  }

  loadQuestion();
}

function showResult(){
  let max = Math.max(score.leader, score.emotional, score.logical);

  let text = "";

  if(max === score.leader){
    text = "🔥 شخصية قيادية: تحب السيطرة واتخاذ القرار.";
  }
  else if(max === score.emotional){
    text = "❤️ شخصية عاطفية: تعتمد على المشاعر والارتباط.";
  }
  else{
    text = "🧠 شخصية منطقية: تفكر وتحلل قبل أي قرار.";
  }

  document.getElementById("title").innerText = "النتيجة";
  document.getElementById("question").innerText = "";
  document.getElementById("answers").innerHTML = "";
  document.getElementById("result").innerText = text;
}

// تشغيل
loadQuestion();
</script>

</body>
</html>
