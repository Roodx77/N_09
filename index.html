<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>لعبة العلاقات</title>

<style>
body{
  margin:0;
  min-height:100vh;
  background:#000;
  color:#eee;
  font-family:Arial;
  display:flex;
  justify-content:center;
  align-items:center;
}

.box{
  width:90%;
  max-width:500px;
  background:#111;
  padding:30px;
  border-radius:20px;
  text-align:center;
}

h1{color:#4fd1c5}

button{
  width:100%;
  padding:14px;
  margin-top:10px;
  border:none;
  border-radius:12px;
  font-size:16px;
  background:#4fd1c5;
  color:#000;
  cursor:pointer;
}

.result{
  margin-top:20px;
  background:#000;
  padding:15px;
  border-radius:12px;
  line-height:1.7;
}
</style>
</head>

<body>

<div class="box">
  <h1>🎮</h1>

  <div id="stage"></div>

  <div id="result" class="result"></div>
</div>

<script>
let state = {
  type:null,
  decision:null
};

const stage = document.getElementById("stage");
const result = document.getElementById("result");

// المرحلة 1
function stage1(){
  stage.innerHTML = `
    <p>وش وضعك؟</p>
    <button onclick="chooseType('ex')">💔 اكس</button>
    <button onclick="chooseType('lover')">❤️ حبيب</button>
  `;
}

// المرحلة 2
function stage2(){
  if(state.type==="ex"){
    stage.innerHTML = `
      <p>وش تبي تسوي؟</p>
      <button onclick="chooseDecision('revenge')">🔥 انتقام</button>
      <button onclick="chooseDecision('move')">🧘‍♂️ تخطي</button>
    `;
  }else{
    stage.innerHTML = `
      <p>وش هدفك؟</p>
      <button onclick="chooseDecision('stay')">❤️ استمرار</button>
      <button onclick="chooseDecision('think')">🤔 تقييم</button>
    `;
  }
}

// النتيجة
function showResult(){
  let text = "";

  if(state.type==="ex" && state.decision==="revenge"){
    text = "أنت تحاول تعويض الألم بالسيطرة، لكن الانتقام يربطك بالماضي أكثر.";
  }
  else if(state.type==="ex" && state.decision==="move"){
    text = "أنت بدأت تفهم أن التخطي قوة، وليس هروب.";
  }
  else if(state.type==="lover" && state.decision==="stay"){
    text = "أنت تميل للاستقرار، لكن تأكد أن الاستمرار مبني على وعي.";
  }
  else if(state.type==="lover" && state.decision==="think"){
    text = "أنت تبحث عن فهم العلاقة، وهذا يدل على نضج.";
  }

  stage.innerHTML = `<p>النتيجة:</p>`;
  result.innerText = text;
}

// التحكم
function chooseType(t){
  state.type = t;
  stage2();
}

function chooseDecision(d){
  state.decision = d;
  showResult();
}

// بدء اللعبة
stage1();
</script>

</body>
</html>
